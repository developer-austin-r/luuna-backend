services:
  db:
    image: postgres:16-alpine
    container_name: luuna-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-luuna_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-luuna_pass}
      POSTGRES_DB: ${DB_NAME:-luuna_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-luuna_user} -d ${DB_NAME:-luuna_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luuna-network

  backend:
    image: ghcr.io/developer-austin-r/luuna-backend:latest
    container_name: luuna-backend-app
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - luuna-network

volumes:
  postgres_data:
    name: luuna-backend_postgres_data
    driver: local

networks:
  luuna-network:
    driver: bridge
