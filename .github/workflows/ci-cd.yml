name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull Node base image with retry
        run: |
          for attempt in 1 2 3; do
            if docker pull node:24-bookworm-slim; then exit 0; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/compose/docker-compose.yml"
          target: "/home/ubuntu/luuna-backend"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            PROJECT_DIR="/home/ubuntu/luuna-backend"
            COMPOSE_FILE="$PROJECT_DIR/infra/compose/docker-compose.yml"
            ENV_FILE="$PROJECT_DIR/.env"

            # --project-directory tells Docker Compose that .env in the compose
            # file resolves to $PROJECT_DIR/.env (not relative to the compose file).
            DC="sudo docker compose -f $COMPOSE_FILE --project-directory $PROJECT_DIR --env-file $ENV_FILE"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found. Create it on the server first."
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            echo "Pulling latest backend image..."
            $DC pull --quiet

            # Backend owns luuna-network — create it if it does not exist yet.
            sudo docker network inspect luuna-network >/dev/null 2>&1 \
              || sudo docker network create luuna-network

            echo "Stopping old containers..."
            $DC down --remove-orphans

            echo "Starting PostgreSQL..."
            $DC up -d db

            echo "Waiting for PostgreSQL to be healthy..."
            for i in $(seq 1 30); do
              STATUS=$(sudo docker inspect --format='{{.State.Health.Status}}' luuna-backend-db 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && echo "PostgreSQL is healthy." && break
              [ "$i" -eq 30 ] && echo "ERROR: PostgreSQL did not become healthy in time." && exit 1
              echo "  attempt $i/30..."; sleep 5
            done

            echo "Running database migrations..."
            $DC run --rm --no-deps backend npx prisma migrate deploy

            echo "Seeding reference data..."
            $DC run --rm --no-deps backend npm run prisma:seed

            echo "Starting backend..."
            $DC up -d backend

            # Both services share the same server and network.
            # Always restart the frontend after a backend deployment
            # so both containers stay in sync.
            FRONTEND_PROJECT="/home/ubuntu/luuna-frontend"
            FRONTEND_COMPOSE="$FRONTEND_PROJECT/infra/compose/docker-compose.yml"
            FRONTEND_ENV="$FRONTEND_PROJECT/.env"
            if [ -f "$FRONTEND_COMPOSE" ] && [ -f "$FRONTEND_ENV" ]; then
              echo "Restarting frontend..."
              sudo docker compose \
                -f "$FRONTEND_COMPOSE" \
                --project-directory "$FRONTEND_PROJECT" \
                --env-file "$FRONTEND_ENV" \
                down --remove-orphans
              sudo docker compose \
                -f "$FRONTEND_COMPOSE" \
                --project-directory "$FRONTEND_PROJECT" \
                --env-file "$FRONTEND_ENV" \
                up -d
            fi

            sudo docker image prune -f

            echo "=== Running containers ==="
            sudo docker ps
            echo "Backend deployment complete."
