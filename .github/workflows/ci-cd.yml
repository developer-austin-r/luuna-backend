name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull Node base image with retry
        run: |
          for attempt in 1 2 3; do
            if docker pull node:24-bookworm-slim; then exit 0; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 10))
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/compose/docker-compose.yml"
          target: "/home/ubuntu/luuna-backend"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            PROJECT_DIR="/home/ubuntu/luuna-backend"
            COMPOSE_FILE="$PROJECT_DIR/infra/compose/docker-compose.yml"
            ENV_FILE="$PROJECT_DIR/.env"

            # --project-directory tells Docker Compose that .env in the compose
            # file resolves to $PROJECT_DIR/.env (not relative to the compose file).
            DC="sudo docker compose -f $COMPOSE_FILE --project-directory $PROJECT_DIR --env-file $ENV_FILE"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE not found. Create it on the server first."
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            # Ensure shared network exists (owned by backend, joined by frontend as external).
            sudo docker network inspect luuna-network >/dev/null 2>&1 \
              || sudo docker network create luuna-network

            echo "Waiting for PostgreSQL to be healthy (must already be running)..."
            for i in $(seq 1 30); do
              STATUS=$(sudo docker inspect --format='{{.State.Health.Status}}' luuna-backend-db 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && echo "PostgreSQL is healthy." && break
              [ "$i" -eq 30 ] && echo "ERROR: PostgreSQL is not healthy. Start it manually first." && exit 1
              echo "  attempt $i/30..."; sleep 5
            done

            echo "Running database migrations..."
            $DC run --rm --no-deps backend npx prisma migrate deploy

            echo "Seeding reference data..."
            $DC run --rm --no-deps backend npm run prisma:seed

            echo "Pulling latest backend image..."
            $DC pull backend

            echo "Recreating backend container only..."
            $DC up -d backend

            sudo docker image prune -f

            echo "=== Running containers ==="
            sudo docker ps
            echo "Backend deployment complete."
